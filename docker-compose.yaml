# The image is built from security/october-2026 on the Spain builder and loaded
# on Mooncake. See fleet's coolify-security runbook before rebuilding or pruning.
services:
  web:
    image: coolify-security/portfolio-antonia:20261024
    pull_policy: never
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
